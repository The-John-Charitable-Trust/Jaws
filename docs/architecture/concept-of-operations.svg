<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 810" role="img" aria-label="JAWS end-state concept of operations"><rect width="1120" height="810" fill="#fff"/><rect x="8" y="9" width="1104" height="790" rx="12" fill="white" stroke="#164b9a" stroke-width="2"/><rect x="9" y="10" width="1102" height="86" rx="12" fill="#0c2868"/><text x="560" y="46" fill="white" font-size="26" text-anchor="middle" font-weight="bold">JAWS CONCEPT OF OPERATIONS</text><text x="560" y="73" text-anchor="middle" fill="#d7e7ff" font-size="15">Operator → Supervisor → Specialist → Tool → Governed Action → Evidence</text><rect x="42" y="112" width="1032" height="31" rx="6" fill="#e7effc"/><text x="560" y="133" text-anchor="middle" font-size="14" fill="#18468d">Trust boundary: operator identity • private network • least privilege • human approval • audited tool calls</text><g><rect x="42" y="158" width="486" height="103" rx="12" fill="#eaf1ff" stroke="#2b62b1" stroke-width="2" /><circle cx="69" cy="187" r="17" fill="#2b62b1"/><text x="69" y="193" fill="white" text-anchor="middle" font-size="17" font-weight="bold">1</text><text x="100" y="190" font-size="19" font-weight="bold" fill="#123469">Teams request</text><text x="100" y="221" font-size="15" fill="#34516d">Operator states an incident</text></g><g><rect x="588" y="158" width="486" height="103" rx="12" fill="#eaf1ff" stroke="#2b62b1" stroke-width="2" /><circle cx="615" cy="187" r="17" fill="#2b62b1"/><text x="615" y="193" fill="white" text-anchor="middle" font-size="17" font-weight="bold">2</text><text x="646" y="190" font-size="19" font-weight="bold" fill="#123469">Supervisor routing</text><text x="646" y="221" font-size="15" fill="#34516d">Select VM or observability specialist</text></g><g><rect x="42" y="296" width="486" height="103" rx="12" fill="#eaf1ff" stroke="#2b62b1" stroke-width="2" /><circle cx="69" cy="325" r="17" fill="#2b62b1"/><text x="69" y="331" fill="white" text-anchor="middle" font-size="17" font-weight="bold">3</text><text x="100" y="328" font-size="19" font-weight="bold" fill="#123469">Investigation</text><text x="100" y="359" font-size="15" fill="#34516d">Authorized tools gather evidence</text></g><g><rect x="588" y="296" width="486" height="103" rx="12" fill="#eaf1ff" stroke="#2b62b1" stroke-width="2" /><circle cx="615" cy="325" r="17" fill="#2b62b1"/><text x="615" y="331" fill="white" text-anchor="middle" font-size="17" font-weight="bold">4</text><text x="646" y="328" font-size="19" font-weight="bold" fill="#123469">Deliberation</text><text x="646" y="359" font-size="15" fill="#34516d">Assess alternatives and impact</text></g><g><rect x="42" y="434" width="486" height="103" rx="12" fill="#eaf1ff" stroke="#2b62b1" stroke-width="2" /><circle cx="69" cy="463" r="17" fill="#2b62b1"/><text x="69" y="469" fill="white" text-anchor="middle" font-size="17" font-weight="bold">5</text><text x="100" y="466" font-size="19" font-weight="bold" fill="#123469">Human approval</text><text x="100" y="497" font-size="15" fill="#34516d">Check identity, RBAC, authorization</text></g><g><rect x="588" y="434" width="486" height="103" rx="12" fill="#eaf1ff" stroke="#2b62b1" stroke-width="2" /><circle cx="615" cy="463" r="17" fill="#2b62b1"/><text x="615" y="469" fill="white" text-anchor="middle" font-size="17" font-weight="bold">6</text><text x="646" y="466" font-size="19" font-weight="bold" fill="#123469">Execution</text><text x="646" y="497" font-size="15" fill="#34516d">Apply only approved change</text></g><g><rect x="42" y="572" width="486" height="103" rx="12" fill="#eaf1ff" stroke="#2b62b1" stroke-width="2" /><circle cx="69" cy="601" r="17" fill="#2b62b1"/><text x="69" y="607" fill="white" text-anchor="middle" font-size="17" font-weight="bold">7</text><text x="100" y="604" font-size="19" font-weight="bold" fill="#123469">Independent validation</text><text x="100" y="635" font-size="15" fill="#34516d">Verify result, contain failures</text></g><g><rect x="588" y="572" width="486" height="103" rx="12" fill="#eaf1ff" stroke="#2b62b1" stroke-width="2" /><circle cx="615" cy="601" r="17" fill="#2b62b1"/><text x="615" y="607" fill="white" text-anchor="middle" font-size="17" font-weight="bold">8</text><text x="646" y="604" font-size="19" font-weight="bold" fill="#123469">Evidence &amp; report</text><text x="646" y="635" font-size="15" fill="#34516d">Citations, trace, project history</text></g><g stroke="#336bb8" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M528 212 H588"/><path d="M830 261 V278 H285 V296"/><path d="M528 350 H588"/><path d="M830 399 V417 H285 V434"/><path d="M528 488 H588"/><path d="M830 537 V555 H285 V572"/><path d="M528 626 H588"/></g><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#336bb8"/></marker></defs><text x="560" y="739" text-anchor="middle" fill="#52647c" font-size="14">Exception paths: insufficient evidence → investigate again; denied approval → stop; validation failure → escalation / governed rollback.</text><text x="560" y="765" text-anchor="middle" fill="#52647c" font-size="13">Specialists stay in the customer virtual network. Foundry-to-Foundry A2A uses services.ai.azure.com.</text></svg>