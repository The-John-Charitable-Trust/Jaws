<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" role="img" aria-label="JAWS reference system architecture"><rect width="1120" height="800" fill="white"/><rect x="8" y="9" width="1104" height="780" rx="12" fill="#fff" stroke="#154999" stroke-width="2"/><rect x="9" y="10" width="1102" height="75" rx="10" fill="#0c2868"/><text x="560" y="43" text-anchor="middle" fill="white" font-size="25" font-weight="bold">JAWS END-STATE SYSTEM ARCHITECTURE</text><text x="560" y="67" text-anchor="middle" fill="#dbeafe" font-size="14">Supervisor • Specialist Agents • MCP • Operator-Scope Security • Governed Execution</text><rect x="27" y="98" width="1064" height="60" fill="#eaf0ff" stroke="#688edb" rx="9"/><text x="560" y="121" text-anchor="middle" font-weight="bold" font-size="17" fill="#0b2a62">HUMAN INTERACTION  |  MICROSOFT TEAMS  |  ENTRA ID  |  PROJECT CONVERSATIONS</text><text x="560" y="145" text-anchor="middle" font-size="13" fill="#2c4770">Operators initiate requests; specialist actions must respect initiating operator permissions</text><g><rect x="32" y="180" rx="11" width="230" height="120" fill="#f0f5ff" stroke="#2b62b1" stroke-width="2" /><circle cx="52" cy="202" r="14" fill="#2b62b1"/><text x="52" y="207" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">A</text><text x="74" y="207" font-weight="bold" font-size="15" fill="#0b2a62">Environment &amp; State</text><text x="47" y="246" font-size="13" fill="#263a55">Subscription discovery</text><text x="47" y="263" font-size="13" fill="#263a55">Read-only drift checks</text><text x="47" y="280" font-size="13" fill="#263a55">Approved DEV inventory</text></g><g><rect x="290" y="180" rx="11" width="230" height="120" fill="#f0f5ff" stroke="#2b62b1" stroke-width="2" /><circle cx="310" cy="202" r="14" fill="#2b62b1"/><text x="310" y="207" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">B</text><text x="332" y="207" font-weight="bold" font-size="15" fill="#0b2a62">Foundry Foundation</text><text x="305" y="246" font-size="13" fill="#263a55">Foundry project + ACR</text><text x="305" y="263" font-size="13" fill="#263a55">Hosted Supervisor v5</text><text x="305" y="280" font-size="13" fill="#263a55">Immutable container images</text></g><g><rect x="548" y="180" rx="11" width="250" height="120" fill="#f0f5ff" stroke="#2b62b1" stroke-width="2" /><circle cx="568" cy="202" r="14" fill="#2b62b1"/><text x="568" y="207" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">C</text><text x="590" y="207" font-weight="bold" font-size="15" fill="#0b2a62">A2A Investigation Planner</text><text x="563" y="246" font-size="13" fill="#263a55">RemoteA2A + toolbox v2</text><text x="563" y="263" font-size="13" fill="#263a55">Prompt planner v1</text><text x="563" y="280" font-size="13" fill="#263a55">Read-only VM plan</text></g><g><rect x="826" y="180" rx="11" width="265" height="120" fill="#f0f5ff" stroke="#2b62b1" stroke-width="2" /><circle cx="846" cy="202" r="14" fill="#2b62b1"/><text x="846" y="207" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">D</text><text x="868" y="207" font-weight="bold" font-size="15" fill="#0b2a62">VM Specialist + Compute</text><text x="841" y="246" font-size="13" fill="#263a55">One VM specialist</text><text x="841" y="263" font-size="13" fill="#263a55">One compute environment</text><text x="841" y="280" font-size="13" fill="#263a55">Investigation runtime</text></g><g><rect x="32" y="382" rx="11" width="230" height="120" fill="#f0f5ff" stroke="#2b62b1" stroke-width="2" /><circle cx="52" cy="404" r="14" fill="#2b62b1"/><text x="52" y="409" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">E</text><text x="74" y="409" font-weight="bold" font-size="15" fill="#0b2a62">Azure MCP Investigation</text><text x="47" y="448" font-size="13" fill="#263a55">Azure MCP tools</text><text x="47" y="465" font-size="13" fill="#263a55">Operator-scoped RBAC</text><text x="47" y="482" font-size="13" fill="#263a55">Grounded VM evidence</text></g><g><rect x="290" y="382" rx="11" width="230" height="120" fill="#f0f5ff" stroke="#2b62b1" stroke-width="2" /><circle cx="310" cy="404" r="14" fill="#2b62b1"/><text x="310" y="409" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">F</text><text x="332" y="409" font-weight="bold" font-size="15" fill="#0b2a62">Deliberation &amp; Remediation</text><text x="305" y="448" font-size="13" fill="#263a55">Risk and alternatives</text><text x="305" y="465" font-size="13" fill="#263a55">Human authorization</text><text x="305" y="482" font-size="13" fill="#263a55">Controlled change</text></g><g><rect x="548" y="382" rx="11" width="250" height="120" fill="#f0f5ff" stroke="#2b62b1" stroke-width="2" /><circle cx="568" cy="404" r="14" fill="#2b62b1"/><text x="568" y="409" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">G</text><text x="590" y="409" font-weight="bold" font-size="15" fill="#0b2a62">Observability Specialist</text><text x="563" y="448" font-size="13" fill="#263a55">Key Vault holds SaaS secrets</text><text x="563" y="465" font-size="13" fill="#263a55">Datadog Agent on default VM</text><text x="563" y="482" font-size="13" fill="#263a55">ServiceNow incident module</text></g><g><rect x="826" y="382" rx="11" width="265" height="120" fill="#f0f5ff" stroke="#2b62b1" stroke-width="2" /><circle cx="846" cy="404" r="14" fill="#2b62b1"/><text x="846" y="409" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">H</text><text x="868" y="409" font-weight="bold" font-size="15" fill="#0b2a62">Teams + Project Context</text><text x="841" y="448" font-size="13" fill="#263a55">Operator conversations</text><text x="841" y="465" font-size="13" fill="#263a55">Project categorization</text><text x="841" y="482" font-size="13" fill="#263a55">Project-scoped context</text></g><g><rect x="410" y="600" rx="11" width="310" height="118" fill="#f0f5ff" stroke="#2b62b1" stroke-width="2" /><circle cx="430" cy="622" r="14" fill="#2b62b1"/><text x="430" y="627" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">I</text><text x="452" y="627" font-weight="bold" font-size="15" fill="#0b2a62">End-to-End Acceptance</text><text x="425" y="666" font-size="13" fill="#263a55">Teams VM security incident</text><text x="425" y="683" font-size="13" fill="#263a55">Correlated audit evidence</text><text x="425" y="700" font-size="13" fill="#263a55">Governed completion</text></g><g stroke="#396cbb" stroke-width="2" fill="none" marker-end="url(#arr)"><path d="M262 239 H290"/><path d="M520 239 H548"/><path d="M798 239 H826"/><path d="M957 302 V382"/><path d="M262 442 H290"/><path d="M520 442 H548"/><path d="M798 442 H826"/><path d="M670 504 V550 H565 V600"/></g><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#396cbb"/></marker></defs><text x="34" y="345" font-size="13" fill="#4b637d">Azure MCP and custom MCP are specialist tools, not direct Supervisor-to-Azure shortcuts.</text><text x="34" y="365" font-size="13" fill="#4b637d">The Step C planner is an A2A interface; the hosted Investigation runtime is reserved for later integration.</text><rect x="25" y="742" width="1070" height="35" rx="5" fill="#e9f0fc"/><text x="560" y="764" text-anchor="middle" font-size="13" fill="#164581">Reference design shows proposed end-state components; implementation and acceptance are tracked separately.</text></svg>