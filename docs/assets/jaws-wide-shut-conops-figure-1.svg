  <rect x="666" y="250" width="198" height="66" rx="10" class="agent"/><use href="#icon-foundry" x="680" y="260"/><text x="738" y="282" class="agentTitle">Azure OpenAI / Foundry</text><text x="738" y="302" class="tiny">model endpoint and reasoning</text>
  <rect x="442" y="344" width="92" height="84" rx="10" class="agent"/><use href="#icon-agent" x="465" y="352"/><text x="488" y="414" text-anchor="middle" class="agentTitle">Support</text>
  <rect x="548" y="344" width="104" height="84" rx="10" class="agent"/><use href="#icon-shield" x="577" y="352"/><text x="600" y="414" text-anchor="middle" class="agentTitle">Governance</text>
  <rect x="666" y="344" width="92" height="84" rx="10" class="agent"/><use href="#icon-approval" x="689" y="352"/><text x="712" y="414" text-anchor="middle" class="agentTitle">Deploy</text>
  <rect x="772" y="344" width="92" height="84" rx="10" class="agent"/><use href="#icon-mcp" x="795" y="352"/><text x="818" y="414" text-anchor="middle" class="agentTitle">Workflow</text>
