  <g transform="translate(948,328)"><use href="#icon-datadog"/><text x="58" y="17" class="small">Datadog tools</text><text x="58" y="36" class="tiny">coverage, synthetic, webhook test</text></g>
  <g transform="translate(948,386)"><use href="#icon-snow"/><text x="58" y="17" class="small">ServiceNow tools</text><text x="58" y="36" class="tiny">CMDB, incident, work notes</text></g>

  <rect x="1246" y="188" width="324" height="270" rx="12" class="panel"/>
  <circle cx="1274" cy="216" r="14" class="num"/><text x="1274" y="221" text-anchor="middle" class="numText">4</text>
  <text x="1298" y="222" class="h">External SaaS Systems</text>
  <rect x="1270" y="252" width="264" height="72" rx="10" class="panel-purple"/><use href="#icon-datadog" x="1288" y="265"/><text x="1348" y="286" class="h2">Datadog</text><text x="1348" y="306" class="tiny">synthetic, monitor, webhook alert</text>
  <rect x="1270" y="346" width="264" height="72" rx="10" class="panel-green"/><use href="#icon-snow" x="1288" y="359"/><text x="1348" y="380" class="h2">ServiceNow</text><text x="1348" y="400" class="tiny">CMDB, incident, work notes</text>
  <text x="1272" y="443" class="tiny">Vendor systems remain authoritative.</text>

  <rect x="30" y="492" width="1184" height="180" rx="12" class="panel-orange"/>
  <circle cx="58" cy="520" r="14" class="num"/><text x="58" y="525" text-anchor="middle" class="numText">5</text>
  <text x="82" y="526" class="h">Human-In-The-Loop Workflow For Tutorial Demo</text>
  <g transform="translate(64,552)"><rect width="198" height="84" rx="10" class="agent"/><use href="#icon-azure" x="14" y="20"/><text x="72" y="28" class="agentTitle">Investigate</text><text x="72" y="49" class="tiny">find unhealthy or uncovered</text><text x="72" y="65" class="tiny">Azure resource candidates</text></g>
  <g transform="translate(286,552)"><rect width="198" height="84" rx="10" class="agent"/><use href="#icon-datadog" x="14" y="20"/><text x="72" y="28" class="agentTitle">Recommend</text><text x="72" y="49" class="tiny">propose Datadog synthetic</text><text x="72" y="65" class="tiny">and webhook contract</text></g>
  <g transform="translate(508,552)"><rect width="198" height="84" rx="10" class="agent"/><use href="#icon-approval" x="14" y="20"/><text x="72" y="28" class="agentTitle">Approve</text><text x="72" y="49" class="tiny">capture approval reference</text><text x="72" y="65" class="tiny">before write actions</text></g>
  <g transform="translate(730,552)"><rect width="198" height="84" rx="10" class="agent"/><use href="#icon-mcp" x="14" y="20"/><text x="72" y="28" class="agentTitle">Execute</text><text x="72" y="49" class="tiny">create Datadog synthetic</text><text x="72" y="65" class="tiny">and test webhook</text></g>
  <g transform="translate(952,552)"><rect width="198" height="84" rx="10" class="agent"/><use href="#icon-snow" x="14" y="20"/><text x="72" y="28" class="agentTitle">Validate</text><text x="72" y="49" class="tiny">confirm ServiceNow incident</text><text x="72" y="65" class="tiny">and return evidence</text></g>

  <rect x="1246" y="492" width="324" height="180" rx="12" class="future"/>
  <circle cx="1274" cy="520" r="14" fill="#b7791f"/><text x="1274" y="525" text-anchor="middle" class="numText">6</text>
  <text x="1298" y="526" class="h">Future / Ultimate State</text>
  <g transform="translate(1270,548)"><use href="#icon-mcp"/><text x="58" y="16" class="small">Azure MCP Server integration</text><text x="58" y="34" class="tiny">Defender, Sentinel, Security Copilot</text></g>
  <g transform="translate(1270,604)"><use href="#icon-book"/><text x="58" y="16" class="small">RAG, runbooks, SOPs</text><text x="58" y="34" class="tiny">broader remediation after approval</text></g>

  <rect x="30" y="704" width="1540" height="126" rx="12" class="panel-gray"/>
  <text x="54" y="736" class="h">Figure Scope</text>
  <text x="54" y="766" class="txt">In scope for the tutorial demo: a Teams-style user conversation that investigates Azure resource coverage, proposes a Datadog synthetic or monitor, pauses for approval, creates/tests the Datadog webhook path, and records ServiceNow incident evidence.</text>
  <text x="54" y="796" class="txt">Proposed future or ultimate state: broader Microsoft security integrations, automated remediation, Azure MCP Server tools, richer RAG/context stores, compliance deployment profiles, and additional customer-authored agents.</text>

  <rect x="30" y="856" width="1540" height="92" rx="12" class="panel"/>
  <text x="54" y="886" class="h">End-To-End Flow</text>
  <text x="54" y="916" class="small">1. User asks in Teams.  2. Agents reason over Azure evidence and curated guidance.  3. Secured MCP tools provide live context and provider actions.  4. Human approval unlocks write-capable workflow.  5. Datadog synthetic/webhook and ServiceNow incident are validated.  6. Future integrations extend the same governed pattern.</text>

