  <g transform="translate(58,326)"><use href="#icon-shield"/><text x="58" y="17" class="small">Policy and compliance evidence</text><text x="58" y="36" class="tiny">read-only evidence collection</text></g>
  <g transform="translate(58,384)"><use href="#icon-book"/><text x="58" y="17" class="small">Application Insights / Log Analytics</text><text x="58" y="36" class="tiny">queries and operational traces</text></g>

  <rect x="418" y="188" width="472" height="270" rx="12" class="panel-purple"/>
  <circle cx="446" cy="216" r="14" class="num"/><text x="446" y="221" text-anchor="middle" class="numText">2</text>
