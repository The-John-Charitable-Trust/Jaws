  <title id="title">Figure 1. JAWS Wide Shut end-state concept of operations</title>
  <desc id="desc">Icon-rich conceptual architecture for the JAWS Wide Shut tutorial use case showing Teams, Azure, Microsoft Agent Framework, secured MCP tools, Datadog, ServiceNow, human approval, evidence stores, and future-state platform extensions.</desc>
